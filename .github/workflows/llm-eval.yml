name: LLM behavior evaluation

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'baselines/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/llm-eval.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: Evaluation tier
        type: choice
        default: smoke
        options: [smoke, regression]

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pytest -q

  evaluate:
    needs: tests
    # Fork PRs get unit tests only; never expose secrets via pull_request_target.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: llm-evaluation
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      LLMGUARD_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read reviewed baseline from target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _baseline
          sparse-checkout: baselines
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache
          key: banking77-${{ runner.os }}-${{ hashFiles('src/llmguard/data/banking77.py', 'src/llmguard/data/intents.py') }}
      - run: python -m pip install -e .
      - name: BANKING77 quality gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CLASSIFIER_MODEL: ${{ vars.OPENAI_CLASSIFIER_MODEL }}
          OPENAI_JUDGE_MODEL: ${{ vars.OPENAI_JUDGE_MODEL }}
          LLMGUARD_CONCURRENCY: '3'
        run: >-
          python -m llmguard.cli compare
          --prompt prompts/banking77_v3.yaml
          --tier "$LLMGUARD_TIER"
          --baseline-file "_baseline/baselines/$LLMGUARD_TIER.json"
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmguard-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
